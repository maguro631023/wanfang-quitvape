name: Deploy to GitHub Pages

# 放置路徑：.github/workflows/deploy.yml
# 部署來源：www/（Capacitor 的 webDir，與打包進 APK 的是同一份檔案）

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: 檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 確認 index.html 存在
        run: test -f www/index.html || (echo "www/index.html 不存在" && exit 1)

      # 單檔 HTML 的內嵌 JS 沒有建置階段，語法錯誤會直接上線後才發現。
      # 抽出來跑 node --check，全形括號、缺逗號這類錯誤在這裡就會擋下。
      - name: 內嵌 JavaScript 語法檢查
        run: |
          python3 - <<'PY'
          import re, sys
          html = open('www/index.html', encoding='utf-8').read()
          blocks = re.findall(r'<script>([\s\S]*?)</script>', html)
          if not blocks:
              sys.exit('找不到內嵌 script')
          open('/tmp/inline.js', 'w', encoding='utf-8').write('\n'.join(blocks))
          PY
          node --check /tmp/inline.js
          echo "JS 語法 OK"

      # 這是還沒經過衛教審閱與 IRB 的原型，不應該被搜尋引擎收錄。
      - name: 確認 noindex 仍在
        run: |
          grep -q 'name="robots"' www/index.html \
            || (echo "缺少 noindex meta，拒絕部署" && exit 1)

      # 資料必須留在裝置端。出現外部請求代表 INTENDED_USE.md 第 6 節
      # 與 Play 的 Data safety 申報都需要重新檢視。
      - name: 確認沒有對外傳輸
        run: |
          if grep -nE '\b(fetch|XMLHttpRequest|navigator\.sendBeacon)\s*\(' www/index.html; then
            echo "偵測到對外請求，請確認是否符合預期用途聲明" && exit 1
          fi
          echo "無對外請求"

  deploy:
    name: 部署
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./www

      - id: deployment
        uses: actions/deploy-pages@v4
